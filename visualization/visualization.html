<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --stage:#070b2c;
    --stage-text:#eef1ff;
    --stage-muted:rgba(214,222,255,0.70);
    --bg:#eef0f5;
    --surface:#ffffff;
    --surface-2:#f4f5f9;
    --glass:rgba(255,255,255,0.86);
    --glass-line:rgba(255,255,255,0.55);
    --text:#14161f;
    --muted:#5b5f70;
    --line:rgba(20,22,31,0.10);
    --amber:#c97a1f;
    --violet:#6d4fc4;
    --radius:14px;
    --font-display:'Space Grotesk', 'Inter', system-ui, sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141c;
      --surface:#1b1e29;
      --surface-2:#20232f;
      --glass:rgba(20,23,36,0.78);
      --glass-line:rgba(238,240,244,0.10);
      --text:#eef0f4;
      --muted:#8b90a3;
      --line:rgba(238,240,244,0.10);
      --amber:#f2a94e;
      --violet:#a78bfa;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141c;
    --surface:#1b1e29;
    --surface-2:#20232f;
    --glass:rgba(20,23,36,0.78);
    --glass-line:rgba(238,240,244,0.10);
    --text:#eef0f4;
    --muted:#8b90a3;
    --line:rgba(238,240,244,0.10);
    --amber:#f2a94e;
    --violet:#a78bfa;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--stage);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }

  #app{position:relative;width:100%;height:100vh;height:100dvh;}

  #canvas-wrap{position:absolute;inset:0;}
  #three-canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  #three-canvas.dragging{cursor:grabbing;}

  header{
    position:absolute;
    top:calc(22px + env(safe-area-inset-top,0px));
    left:24px;
    right:24px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    pointer-events:none;
    z-index:5;
  }
  .brand{pointer-events:auto;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    letter-spacing:0.01em;
    margin:0;
    color:var(--stage-text);
  }
  .brand p{
    margin:3px 0 0;
    font-size:12.5px;
    color:var(--stage-muted);
    max-width:300px;
    line-height:1.4;
  }
  .brand .hint{
    font-family:var(--font-mono);
    font-size:10.5px;
    margin-top:6px;
    opacity:0.8;
  }

  #autorotate-btn{
    pointer-events:auto;
    font-family:var(--font-body);
    font-size:12.5px;
    color:var(--muted);
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    border:1px solid var(--glass-line);
    border-radius:999px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  #autorotate-btn .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    transition:background 0.2s;
  }
  #autorotate-btn.on .dot{background:var(--amber);}
  #autorotate-btn:focus-visible, .navbtn:focus-visible, .railstep:focus-visible, #train-range:focus-visible{
    outline:2px solid var(--violet);
    outline-offset:2px;
  }

  /* rail */
  #rail{
    position:absolute;
    left:28px;
    top:50%;
    transform:translateY(-50%);
    z-index:5;
    display:flex;
    flex-direction:column;
  }
  .railstep{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    padding:9px 6px;
    cursor:pointer;
    text-align:left;
    font-family:var(--font-body);
  }
  .railstep .line{
    position:absolute;
    left:17px;
    top:calc(100% - 9px);
    width:1px;
    height:18px;
    background:rgba(214,222,255,0.22);
  }
  .railstep:last-child .line{display:none;}
  .marker{
    width:23px;height:23px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--line);
    flex-shrink:0;
    transition:background 0.25s, color 0.25s, border-color 0.25s, transform 0.2s, box-shadow 0.25s;
  }
  .railstep.active .marker{
    background:var(--amber);
    border-color:var(--amber);
    color:#1a1204;
    transform:scale(1.08);
    box-shadow:0 0 0 5px rgba(242,169,78,0.18);
  }
  .railstep.done .marker{color:var(--text);border-color:var(--muted);}
  .label{
    font-size:12.5px;
    color:var(--stage-muted);
    opacity:0;
    transform:translateX(-4px);
    transition:opacity 0.2s, transform 0.2s;
    white-space:nowrap;
  }
  .railstep.active .label{color:var(--stage-text);opacity:1;transform:none;}
  #rail:hover .label{opacity:1;transform:none;}

  /* bottom card */
  #hud{
    position:absolute;
    left:50%;
    bottom:calc(26px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);
    z-index:5;
    width:min(580px, calc(100vw - 48px));
  }
  #card{
    background:var(--glass);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    backdrop-filter:blur(16px) saturate(140%);
    border:1px solid var(--glass-line);
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,0.35);
  }
  #step-index{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    margin:0 0 6px;
  }
  #step-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    margin:0 0 8px;
  }
  #step-desc{
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
    margin:0;
    max-width:64ch;
  }
  #readout{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--amber);
    margin-top:12px;
    min-height:14px;
  }

  #slider-row{
    display:none;
    align-items:center;
    gap:12px;
    margin-top:16px;
  }
  #slider-row.show{display:flex;}
  #slider-row span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);}
  #train-range{
    flex:1;
    accent-color:var(--amber);
    height:4px;
  }

  #nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
  }
  .navbtn{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:500;
    color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 16px;
    cursor:pointer;
  }
  .navbtn:disabled{opacity:0.35;cursor:default;}
  .navbtn.primary{background:var(--amber);border-color:var(--amber);color:#1a1204;}

  /* preview panel */
  #preview-panel{
    position:absolute;
    top:calc(72px + env(safe-area-inset-top,0px));
    right:24px;
    z-index:5;
    background:var(--glass);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    backdrop-filter:blur(16px) saturate(140%);
    border:1px solid var(--glass-line);
    border-radius:var(--radius);
    padding:12px;
    display:none;
    box-shadow:0 14px 40px rgba(0,0,0,0.3);
  }
  #preview-panel.show{display:block;}
  .panes{display:flex;gap:10px;}
  .pane{display:flex;flex-direction:column;gap:6px;}
  .pane span{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--muted);
  }
  .pane canvas{
    display:block;
    width:132px;height:132px;
    border-radius:8px;
    background:var(--stage);
  }
  #pane-diff{display:none;}
  #preview-panel.diff #pane-diff{display:flex;}
  #pv-note{
    margin:9px 0 0;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--muted);
  }

  @media (max-width: 760px){
    header{left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));}
    .brand p{display:none;}
    #rail{
      left:0;right:0;
      transform:none;
      position:absolute;
      top:calc(62px + env(safe-area-inset-top,0px));
      flex-direction:row;
      gap:4px;
      overflow-x:auto;
      padding:0 16px;
      width:100%;
    }
    .railstep{padding:6px 4px;}
    .railstep .line{display:none;}
    .label{display:none;}
    #hud{width:calc(100vw - 32px);bottom:calc(16px + env(safe-area-inset-bottom,0px));}
    #card{padding:16px 18px;}
    #step-desc{font-size:13px;}
    #preview-panel{top:calc(104px + env(safe-area-inset-top,0px));right:16px;padding:8px;}
    .panes{gap:6px;}
    .pane canvas{width:76px;height:76px;}
    #pv-note{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    .marker, .label, .railstep .line{transition:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap"><canvas id="three-canvas"></canvas></div>

  <header>
    <div class="brand">
      <h1>From photos to 3D</h1>
      <p>How 75 phone photos of a minifigure become a 3D scene made of Gaussian splats.</p>
      <p class="hint">drag to orbit · scroll to zoom · ← → to step</p>
    </div>
    <button id="autorotate-btn" type="button" aria-pressed="false">
      <span class="dot"></span><span id="autorotate-label">Auto-rotate off</span>
    </button>
  </header>

  <nav id="rail" aria-label="Pipeline steps"></nav>

  <div id="preview-panel">
    <div class="panes">
      <div class="pane"><span>Photo</span><canvas id="pv-photo" width="160" height="160"></canvas></div>
      <div class="pane"><span>Render</span><canvas id="pv-render" width="160" height="160"></canvas></div>
      <div class="pane" id="pane-diff"><span>|Photo − Render|</span><canvas id="pv-diff" width="160" height="160"></canvas></div>
    </div>
    <p id="pv-note">view from the highlighted camera</p>
  </div>

  <div id="hud">
    <div id="card">
      <p id="step-index"></p>
      <h2 id="step-title"></h2>
      <p id="step-desc"></p>
      <p id="readout"></p>
      <div id="slider-row">
        <span>0</span>
        <input type="range" id="train-range" min="0" max="1000" value="0" aria-label="Training progress">
        <span>2500</span>
      </div>
      <div id="nav">
        <button class="navbtn" id="prev-btn" type="button">Back</button>
        <button class="navbtn primary" id="next-btn" type="button">Next</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- helpers ---------- */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(20260926);
  function rr(a,b){ return a + rng()*(b-a); }
  function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
  function smooth(e0,e1,x){ var t = clamp((x-e0)/(e1-e0), 0, 1); return t*t*(3-2*t); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function lin(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }
  function hexToRgb(hex){ var c = new THREE.Color(hex); return [c.r, c.g, c.b]; }
  function makeCanvas(w,h){ var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  var V3 = THREE.Vector3;

  /* ---------- constants ---------- */
  var SPARSE_SURF = 320, FLOATERS = 24;
  var S = SPARSE_SURF + FLOATERS, D = 5200, N = 40000;
  var PHOTOS = 75, ITERS = 2500;
  var TARGET = new V3(0, 1.95, 0);
  var EYE_Z = 0.24, PLANE_Z = 0.95, PLANE_HALF = 0.3;
  var THUMB_FOV = 2 * Math.atan(PLANE_HALF / (PLANE_Z - EYE_Z)) * 180 / Math.PI;
  var PV = 160;

  /* ---------- steps ---------- */
  var STEPS = [
    {
      label:"Capture", title:"Capture the photos",
      desc:"75 phone photos circle the figure at a few heights, with even light and no zoom. Each photo sees the figure from a slightly different angle.",
      cfg:{fig:1, rigs:1, flash:1, rings:1, splat:0, dots:0, train:0, level:0, prune:0, rays:0, proj:0, preview:0, slider:0, radius:12.5},
      readout:function(){ return "photos: " + PHOTOS; }
    },
    {
      label:"Triangulate", title:"Structure from motion",
      desc:"COLMAP finds the same small details in different photos and matches them. From the matches it works out where every camera stood, and it places sparse 3D points where the sightlines meet.",
      cfg:{fig:0.07, rigs:1, flash:0, rings:1, splat:1, dots:1, train:0, level:0, prune:0, rays:1, proj:0, preview:0, slider:0, radius:11.5},
      readout:function(){ return "camera poses: " + PHOTOS + " · sparse points: " + S; }
    },
    {
      label:"Initialize", title:"Turn points into Gaussians",
      desc:"Each sparse point becomes a soft 3D blob. Its size starts at the gap to its nearest neighbour. Its position, size, rotation, opacity and color can all be trained.",
      cfg:{fig:0, rigs:0, flash:0, rings:0, splat:1, dots:0, train:0, level:0, prune:0, rays:0, proj:0, preview:0, slider:0, radius:8.6},
      readout:function(){ return "gaussians: " + S + " · 14 numbers each"; }
    },
    {
      label:"Project", title:"Project onto a camera",
      desc:"For one training photo, every blob is moved into that camera's view, flattened onto its 2D image, and blended from front to back. The result is a rendered image.",
      cfg:{fig:0, rigs:2, flash:0, rings:0, splat:1, dots:0, train:0, level:0, prune:0, rays:0, proj:1, preview:1, slider:0, radius:10.5},
      readout:function(){ return "rendering view 1 of " + PHOTOS + " →"; }
    },
    {
      label:"Train", title:"Compare & train",
      desc:"The render is compared with the real photo (L1 loss). The gradient changes every blob's position, size, rotation, opacity and color. This repeats 2,500 times with random photos.",
      cfg:{fig:0, rigs:2, flash:0, rings:0, splat:1, dots:0, train:'slider', level:0, prune:0, rays:0, proj:0, preview:2, slider:1, radius:9.5},
      readout:function(t){ return "iteration " + Math.round(t*ITERS) + " / " + ITERS + (lastL1 !== null ? " · L1 loss " + lastL1.toFixed(3) : ""); }
    },
    {
      label:"Densify", title:"Grow more detail",
      desc:"Where blobs still can't explain the photos well, new ones split off nearby and get smaller. Useless floaters, which are almost see-through, are pruned away.",
      cfg:{fig:0, rigs:0, flash:0, rings:0, splat:1, dots:0, train:1, level:1, prune:1, rays:0, proj:0, preview:0, slider:0, radius:8.6},
      readout:function(){ return "gaussians: " + S + " → " + liveCount().toLocaleString('en-US') + " · pruned floaters: " + Math.round(FLOATERS*disp.prune); }
    },
    {
      label:"Result", title:"The finished scene",
      desc:"Tens of thousands of small colored blobs together form a full 3D scene. You can rotate it and look at it from any angle. Drag to look around.",
      cfg:{fig:0, rigs:0, flash:0, rings:0, splat:1, dots:0, train:1, level:2, prune:1, rays:0, proj:0, preview:0, slider:0, radius:8.2},
      readout:function(){ return "gaussians: " + liveCount().toLocaleString('en-US'); }
    }
  ];

  /* ---------- renderer & scene ---------- */
  var canvas = document.getElementById('three-canvas');
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var gl = renderer.getContext();
  var maxPointSize = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 256;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

  /* backdrop */
  (function(){
    var cv = makeCanvas(1024, 1024), c = cv.getContext('2d');
    var g = c.createRadialGradient(512, 430, 30, 512, 470, 760);
    g.addColorStop(0, '#2a3fb4');
    g.addColorStop(0.45, '#17257e');
    g.addColorStop(1, '#060a2e');
    c.fillStyle = g; c.fillRect(0, 0, 1024, 1024);
    var r2 = rng;
    for (var i=0;i<9;i++){
      var x = r2()*1024, y = r2()*700, r = 6 + r2()*16;
      var bg = c.createRadialGradient(x, y, 0, x, y, r);
      bg.addColorStop(0, 'rgba(170,190,255,0.16)');
      bg.addColorStop(1, 'rgba(170,190,255,0)');
      c.fillStyle = bg; c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
    }
    var t = new THREE.CanvasTexture(cv);
    t.encoding = THREE.sRGBEncoding;
    scene.background = t;
  })();

  /* environment for glossy plastic */
  (function(){
    var env = new THREE.Scene();
    var room = new THREE.Mesh(new THREE.BoxGeometry(24, 24, 24), new THREE.MeshBasicMaterial({color:new THREE.Color(0.05, 0.06, 0.16), side:THREE.BackSide}));
    env.add(room);
    function panel(w, h, x, y, z, rgb){
      var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color:new THREE.Color(rgb[0], rgb[1], rgb[2]), side:THREE.DoubleSide}));
      m.position.set(x, y, z); m.lookAt(0, 1, 0); env.add(m);
    }
    panel(9, 5, 1, 10, 5, [5, 4.8, 4.5]);
    panel(2.2, 10, -10, 3, 1, [2.4, 2.5, 2.8]);
    panel(2.2, 10, 10, 3, 3, [1.6, 1.6, 1.8]);
    panel(12, 6, 0, 4, -10, [0.5, 0.75, 2.6]);
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.03).texture;
    pm.dispose();
  })();

  /* lights */
  scene.add(new THREE.HemisphereLight(lin('#cfd8ff'), lin('#141a40'), 0.35));
  var key = new THREE.DirectionalLight(lin('#fff1e0'), 2.1);
  key.position.set(3.5, 8.5, 6);
  key.target.position.set(0, 1.4, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -4; key.shadow.camera.right = 4;
  key.shadow.camera.top = 5.5; key.shadow.camera.bottom = -3;
  key.shadow.camera.near = 1; key.shadow.camera.far = 25;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.02;
  scene.add(key); scene.add(key.target);
  var rim = new THREE.DirectionalLight(lin('#7f9cff'), 1.7);
  rim.position.set(-5, 6, -6);
  scene.add(rim);
  var fill = new THREE.DirectionalLight(lin('#ffffff'), 0.45);
  fill.position.set(-6, 3, 4);
  scene.add(fill);

  /* floor */
  var floor;
  (function(){
    var cv = makeCanvas(256, 256), c = cv.getContext('2d');
    var g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#9a9a9a'); g.addColorStop(1, '#000000');
    c.fillStyle = g; c.fillRect(0, 0, 256, 256);
    floor = new THREE.Mesh(new THREE.CircleGeometry(8, 72), new THREE.MeshStandardMaterial({
      color:lin('#1c2672'), roughness:0.5, metalness:0.1, transparent:true, alphaMap:new THREE.CanvasTexture(cv), depthWrite:false
    }));
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -0.002;
    floor.receiveShadow = true;
    scene.add(floor);
  })();

  /* glow sprite texture */
  var glowTex = (function(){
    var cv = makeCanvas(128, 128), c = cv.getContext('2d');
    var g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.65)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(cv);
  })();

  /* ---------- orbit ---------- */
  var radius = 12.5, zoom = 1, theta = 0.55, phi = 1.2;
  var dragging = false, lastX = 0, lastY = 0;
  var autoRotate = false;
  var viewShift = 0;

      '  vec3 c2 = vec3(2.0*(qx*qz+qy*qw), 2.0*(qy*qz-qx*qw), 1.0-2.0*(qx*qx+qy*qy));',
      '  vec3 r0 = vec3(uFocal / z, 0.0, uFocal * mv.x / (z*z));',
      '  vec3 r1 = vec3(0.0, uFocal / z, uFocal * mv.y / (z*z));',
      '  vec3 w0 = modelViewMatrix[0].xyz, w1 = modelViewMatrix[1].xyz, w2 = modelViewMatrix[2].xyz;',
      '  vec3 u0 = vec3(dot(w0, r0), dot(w1, r0), dot(w2, r0));',
      '  vec3 u1 = vec3(dot(w0, r1), dot(w1, r1), dot(w2, r1));',
      '  vec3 p0 = vec3(dot(c0, u0), dot(c1, u0), dot(c2, u0));',
      '  vec3 p1 = vec3(dot(c0, u1), dot(c1, u1), dot(c2, u1));',
      '  vec3 s2 = sc * sc;',
      '  float ca = dot(s2, p0*p0) + 0.3;',
      '  float cb = dot(s2, p0*p1);',
      '  float cc = dot(s2, p1*p1) + 0.3;',
      '  float det = max(ca*cc - cb*cb, 1e-6);',
      '  vec3 conic = vec3(cc, -cb, ca) / det;',
      '  float mid = 0.5 * (ca + cc);',
      '  float lam = mid + sqrt(max(0.1, mid*mid - det));',

  /* ---------- camera rigs ---------- */
  var rigsGroup = new THREE.Group();
  scene.add(rigsGroup);

  function rigMat(m, base){ m.transparent = true; m.userData.base = base; return m; }

    for (var k=0;k<ring.n;k++){

      var darkM = rigMat(new THREE.MeshPhysicalMaterial({color:lin('#0f1015'), metalness:0.2, roughness:0.25, clearcoat:0.8}), 1);

      var rt = new THREE.WebGLRenderTarget(256, 256, {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter});

      var body = new THREE.Mesh(roundedBox(0.46, 0.3, 0.2, 0.04), bodyM); body.position.z = -0.02; rig.add(body);
      var grip = new THREE.Mesh(roundedBox(0.11, 0.3, 0.25, 0.035), darkM); grip.position.set(0.2, 0, 0); rig.add(grip);
      var vf = new THREE.Mesh(roundedBox(0.16, 0.08, 0.14, 0.02), darkM); vf.position.set(-0.06, 0.18, -0.02); rig.add(vf);
      var dial = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.04, 24), trimM); dial.position.set(0.12, 0.17, -0.02); rig.add(dial);
      var barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.125, 0.17, 32), darkM); barrel.rotation.x = Math.PI/2; barrel.position.z = 0.15; rig.add(barrel);

      var lensG = new THREE.Mesh(new THREE.CircleGeometry(0.095, 32), glassM); lensG.position.z = 0.236; rig.add(lensG);

      var fr = [];

  rigsGroup.updateMatrixWorld(true);

  function eyeOf(rig){ return rig.localToWorld(new V3(0, 0, EYE_Z)); }

  var TI = 6;
  var trainCam = thumbCamFor(rigs[TI]);

  /* ring guides */
  var ringGuides = new THREE.Group();
  var ringMat = new THREE.LineBasicMaterial({color:lin('#9fb0ff'), transparent:true, opacity:0});
  RIG_RINGS.forEach(function(ring){
    var pts = [];
    for (var i=0;i<128;i++){ var a = i/128*Math.PI*2; pts.push(new V3(Math.sin(a)*ring.r, ring.y, Math.cos(a)*ring.r)); }
    ringGuides.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), ringMat));
  });
  scene.add(ringGuides);

  /* ---------- flowing line material ---------- */
  function flowMat(hex){
    var c = new THREE.Color(hex);
    return new THREE.ShaderMaterial({
      uniforms:{uColor:{value:new V3(c.r, c.g, c.b)}, uOpacity:{value:0}, uTime:{value:0}},
      vertexShader:'attribute float aT; varying float vT; void main(){ vT = aT; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader:'uniform vec3 uColor; uniform float uOpacity; uniform float uTime; varying float vT; void main(){ float w = fract(vT * 3.0 - uTime * 0.7); float glow = 0.3 + 0.7 * exp(-pow((w - 0.5) * 5.0, 2.0)); gl_FragColor = vec4(uColor, glow * uOpacity); }',
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending

  function segGeo(pairs){

    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aT', new THREE.Float32BufferAttribute(t, 1));
    return g;
  }
  function planeHit(rig, P){
    var pl = rig.worldToLocal(P.clone());

    var t = (PLANE_Z - EYE_Z) / (pl.z - EYE_Z);
    var hx = pl.x * t, hy = pl.y * t;

  }
  function spOf(i){ return new V3(sPos[i*3], sPos[i*3+1], sPos[i*3+2]); }

  /* ---------- triangulation rays & feature matches ---------- */
  var raysGroup = new THREE.Group();
  scene.add(raysGroup);
  var rayMat = flowMat('#2fd3b5'), matchMat = flowMat('#a78bfa');
  var hitMarkers, planeDots;
  (function(){

    var rayPairs = [], matchPairs = [], hits = [], marks = [];
    bands.forEach(function(bd){
      var best = -1, bs = -1e9;

        if (y < bd[0] || y > bd[1]) continue;

  /* ---------- projection lines (one training camera) ---------- */

  /* ---------- thumbnails (the "photos") ---------- */
  function renderThumbs(){

    rigsGroup.visible = raysGroup.visible = projGroup.visible = splats.visible = ringGuides.visible = false;

  /* ---------- preview panes ---------- */
  var pvTarget = new THREE.WebGLRenderTarget(PV, PV);
  pvTarget.texture.encoding = THREE.sRGBEncoding;
  var bufPhoto = new Uint8Array(PV*PV*4), bufRender = new Uint8Array(PV*PV*4);
  var pvPhoto = document.getElementById('pv-photo').getContext('2d');
  var pvRender = document.getElementById('pv-render').getContext('2d');
  var pvDiff = document.getElementById('pv-diff').getContext('2d');

  function renderPreview(withDiff){

    rigsGroup.visible = raysGroup.visible = projGroup.visible = floor.visible = ringGuides.visible = false;

    autoLabel.textContent = autoRotate ? 'Auto-rotate on' : 'Auto-rotate off';
  }
  autoBtn.addEventListener('click', function(){ autoRotate = !autoRotate; syncAutoBtn(); });

  /* ---------- animation loop ---------- */
  var clock = new THREE.Clock(), time = 0;
  function approach(key2, target, rate, dt){
    var k = 1 - Math.pow(1 - rate, dt*60);
    disp[key2] = lerp(disp[key2], target, k);
    if (Math.abs(disp[key2] - target) < 0.0005) disp[key2] = target;
  }

  function frame(){
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    time += dt;
    var s = STEPS[idx].cfg;

    if (trainAuto){
      trainT = Math.min(1, trainT + dt/6);
      trainRange.value = Math.round(trainT*1000);
      if (trainT >= 1) trainAuto = false;
    }
    if (autoRotate && !dragging) theta += dt*0.16;

    approach('radius', s.radius, 0.06, dt);
    radius = disp.radius;
    updateCamera();

    approach('fig', s.fig, 0.1, dt);
    approach('rays', s.rays, 0.08, dt);
    approach('proj', s.proj, 0.08, dt);
    approach('rings', s.rings, 0.08, dt);
    approach('splat', s.splat, 0.08, dt);
    approach('dots', s.dots, 0.06, dt);
    approach('train', s.train === 'slider' ? trainT : s.train, s.train === 'slider' ? 0.3 : 0.05, dt);
    approach('tier1', s.level >= 1 ? 1 : 0, 0.025, dt);
    approach('tier2', s.level >= 2 ? 1 : 0, 0.025, dt);
    approach('spacing', SPACING[s.level], 0.03, dt);
    approach('prune', s.prune, 0.03, dt);

    setFigureFade(disp.fig);

    var flowTime = reducedMotion ? 0 : time;
    rayMat.uniforms.uOpacity.value = disp.rays * 0.9;
    matchMat.uniforms.uOpacity.value = disp.rays * 0.7;
    rayMat.uniforms.uTime.value = matchMat.uniforms.uTime.value = projMat.uniforms.uTime.value = flowTime;
    planeDots.material.opacity = disp.rays;
    hitMarkers.material.opacity = disp.rays;
    hitMarkers.material.size = 0.2 + (reducedMotion ? 0 : 0.06*Math.sin(time*4));
    raysGroup.visible = disp.rays > 0.01;
    projMat.uniforms.uOpacity.value = disp.proj * 0.75;
    projDots.material.opacity = disp.proj;
    projGroup.visible = disp.proj > 0.01;
    ringMat.opacity = disp.rings * 0.3;
    ringGuides.visible = disp.rings > 0.01;

    var flashIdx = Math.floor(time / 0.42) % rigs.length, flashT = (time % 0.42) / 0.42;
    rigs.forEach(function(rig, i){
      var target = s.rigs === 1 ? 1 : (s.rigs === 2 ? (i === TI ? 1 : 0.1) : 0);
      var ud = rig.userData;
      ud.opacity = lerp(ud.opacity, target, 1 - Math.pow(0.9, dt*60));
      if (Math.abs(ud.opacity - target) < 0.001) ud.opacity = target;
      rig.visible = ud.opacity > 0.01;
      ud.mats.forEach(function(m){ m.opacity = m.userData.base * ud.opacity; });
      var f = (s.flash && !reducedMotion && i === flashIdx) ? Math.exp(-flashT*6) : 0;
      ud.flash.material.opacity = f * ud.opacity;
      var bright = 1 + 0.9*f + (s.rigs === 2 && i === TI ? 0.15 : 0);
      ud.img.color.setRGB(bright, bright, bright);
    });

    var count = activeCount();
    splats.visible = disp.splat > 0.01;
    U.uOpacity.value = disp.splat;
    U.uTier1.value = disp.tier1;
    U.uTier2.value = disp.tier2;
    U.uTrain.value = disp.train;
    U.uDots.value = disp.dots;
    U.uSpacing.value = disp.spacing;
    U.uPrune.value = disp.prune;

    var showPreview = !!s.preview;
    if (showPreview && splats.visible) renderPreview(s.preview === 2);

    if (splats.visible){
      camera.updateMatrixWorld();
      U.uFocal.value = renderer.domElement.height * 0.5 / Math.tan(camera.fov * Math.PI / 360);
      U.uPixelRatio.value = renderer.getPixelRatio();
      sortSplats(camera, count);
    }
    renderer.render(scene, camera);

    var text = STEPS[idx].readout(trainT);
    if (readoutEl.textContent !== text) readoutEl.textContent = text;
  }

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h;
    var hud = document.getElementById('hud');
    viewShift = Math.min(hud.offsetHeight * 0.42, h * 0.2);
    camera.setViewOffset(w, h, 0, viewShift, w, h);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  try {
    var saved = localStorage.getItem('p2p3d-step');
    if (saved !== null) idx = Math.max(0, Math.min(STEPS.length-1, parseInt(saved,10)||0));
  } catch(e){}
  var origGoTo = goTo;
  goTo = function(i){
    origGoTo(i);
    try { localStorage.setItem('p2p3d-step', String(idx)); } catch(e){}
  };

  goTo(idx);
  disp.radius = STEPS[idx].cfg.radius;
  resize();
  syncAutoBtn();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
